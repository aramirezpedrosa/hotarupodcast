# GPU NVIDIA (necesita NVIDIA Container Toolkit en el servidor):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  backend:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
    environment:
      HOTARU_DEVICE: cuda
      HOTARU_COMPUTE_TYPE: float16
      HOTARU_BATCH_SIZE: "16"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
