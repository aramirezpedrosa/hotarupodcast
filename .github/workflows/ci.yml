name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir y arrancar (sin modelos)
        run: |
          printf 'HOTARU_ENGINE=fake\nHOTARU_INSTALL_ML=false\n' > .env
          docker compose up -d --build --wait
      - name: Probar la web y la API a través de nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q HotaruPodcast
          curl -fsS http://localhost:8080/api/health
      - if: failure()
        run: docker compose logs
